name: CI

on:
  push:
  pull_request:

jobs:
  quantum-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quantum-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Start the API
        run: |
          python api.py > api.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null localhost:5000 && break; sleep 1; done
      - name: Request quantum random numbers
        run: |
          python test_api.py
          python - <<'PY'
          import requests
          numbers = requests.post("http://127.0.0.1:5000/generate",
                                  json={"num_bits": 17, "num_random_numbers": 200}).json()["random_numbers"]
          assert len(numbers) == 200
          assert all(0 <= n < 2**17 for n in numbers)
          assert len(set(numbers)) > 190, "numbers should almost never repeat"
          print(f"200 numbers in [0, 131071], {len(set(numbers))} distinct, mean {sum(numbers)/200:.0f}")
          PY

  javafx-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: javafx-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile and test the drop tables
        run: mvn -B -q test
